name: Atualizar catálogo

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar catálogos
        run: node scripts/atualizar-catalogo.js

      - name: Verificar alterações
        id: changes
        run: |
          if git diff --quiet; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push
        if: steps.changes.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalogo/*.json

          git commit -m "Atualiza catálogo automaticamente"

          git push