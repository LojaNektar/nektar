<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Catálogo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f9;
            color: #212529;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .descricao {
            color: #6c757d;
            margin-bottom: 25px;
        }

        .acoes {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 12px 20px;
            background: #212529;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #000;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .status {
            font-size: 14px;
        }

        .status.erro {
            color: #dc3545;
        }

        .status.sucesso {
            color: #198754;
        }

        .catalogo {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .cabecalho-catalogo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .cabecalho-catalogo h2 {
            margin: 0;
        }

        .estatisticas {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 5px;
            background: #e9ecef;
            font-size: 13px;
        }

        .badge.ativo {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge.inativo {
            background: #f8d7da;
            color: #842029;
        }

        .badge.novo {
            background: #cfe2ff;
            color: #084298;
        }

        .textarea-container {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 550px;
            resize: vertical;
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 15px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #f8f9fa;
            color: #212529;
        }

        .botao-copiar {
            margin-top: 10px;
            background: #0d6efd;
        }

        .botao-copiar:hover {
            background: #0b5ed7;
        }

        .log {
            background: #212529;
            color: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            min-height: 80px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .cabecalho-catalogo {
                flex-direction: column;
                align-items: flex-start;
            }

            textarea {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Atualizar Catálogo</h1>
        <div class="descricao">
            Consulta a VendiZap e gera os JSONs de Arabic e Brand.
        </div>
        <div class="acoes">
            <button type="button" id="btnAtualizar" onclick="atualizarCatalogos()"> Atualizar catálogos</button>
            <span id="status" class="status">Pronto para atualizar.</span>
        </div>

        <div id="log" class="log"> Aguardando execução...</div>

        <!-- ARABIC -->
        <div class="catalogo">
            <div class="cabecalho-catalogo">
                <h2>Arabic</h2>
                <div id="estatisticasArabic" class="estatisticas"></div>
            </div>
            <div class="textarea-container">
                <textarea id="jsonArabic" spellcheck="false" readonly placeholder="O JSON do Arabic aparecerá aqui..."></textarea>
            </div>
            <button type="button" class="botao-copiar" onclick="copiarJson('jsonArabic', this)"> Copiar JSON Arabic</button>
        </div>

        <!-- BRAND -->
        <div class="catalogo">
            <div class="cabecalho-catalogo">
                <h2>Brand</h2>
                <div id="estatisticasBrand" class="estatisticas"></div>
            </div>
            <div class="textarea-container">
                <textarea id="jsonBrand" spellcheck="false" readonly placeholder="O JSON do Brand aparecerá aqui..."></textarea>
            </div>
            <button type="button" class="botao-copiar" onclick="copiarJson('jsonBrand', this)"> Copiar JSON Brand</button>
        </div>
    </div>
    <script src="atualizar.js"></script>
</body>
</html>
